server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/auth}
spring.datasource.username=${DB_USERNAME:auth}
spring.datasource.password=${DB_PASSWORD:auth}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
